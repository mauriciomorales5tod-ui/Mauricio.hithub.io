<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* --- Estilos del Diseño del Widget --- */
  .laundry-widget {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    max-width: 350px;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 102, 255, 0.1);
    overflow: hidden;
    border: 1px solid #e0f0ff;
    margin: 20px auto;
  }

  .laundry-header {
    background: linear-gradient(135deg, #ad2c7b 0%, #e90707 100%);
    color: white;
    padding: 20px;
    text-align: center;
  }

  .laundry-header h2 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .laundry-header .icon {
    font-size: 2.5rem;
    margin-bottom: 10px;
    display: block;
  }

  .laundry-body {
    padding: 20px;
    color: #333333;
  }

  .laundry-item {
    display: flex;
    align-items: flex-start;
    margin-bottom: 15px;
    line-height: 1.5;
  }

  .laundry-item:last-child {
    margin-bottom: 0;
  }

  .laundry-item span.emoji {
    margin-right: 12px;
    font-size: 1.2rem;
    min-width: 25px;
    text-align: center;
  }

  .laundry-item div {
    display: flex;
    flex-direction: column;
  }

  .laundry-item strong {
    font-size: 0.85rem;
    color: #777777;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }

  .laundry-item p {
    margin: 0;
    font-size: 1rem;
    color: #1a1a1a;
  }
</style>
</head>
